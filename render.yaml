# Render deployment (https://render.com). In Render: New > Blueprint > pick this repo.
# You'll be asked for GEMINI_API_KEY; it's stored in Render, never in the code.
services:
  - type: web
    name: practice-room
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/config
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: GEMINI_API_KEY
        sync: false
